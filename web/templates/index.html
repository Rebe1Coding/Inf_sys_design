<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление клиентами</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>Система управления клиентами</h1>
            <button id="addClientBtn" class="btn btn-primary">Добавить клиента</button>
        </header>

        <!-- Фильтры и сортировка -->
        <div class="controls">
            <div class="filter-group">
                <label for="ownershipFilter">Фильтр по типу собственности:</label>
                <select id="ownershipFilter">
                    <option value="">Все</option>
                    <option value="ООО">ООО</option>
                    <option value="АО">АО</option>
                    <option value="ЗАО">ЗАО</option>
                    <option value="ОАО">ОАО</option>
                    <option value="ПАО">ПАО</option>
                    <option value="ИП">ИП</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sortField">Сортировка:</label>
                <select id="sortField">
                    <option value="client_id">По ID</option>
                    <option value="name">По названию</option>
                    <option value="ownership_type">По типу</option>
                </select>
            </div>
        </div>

        <!-- Таблица клиентов -->
        <div class="table-container">
            <table id="clientsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Название</th>
                        <th>Тип собственности</th>
                        <th>Телефон</th>
                        <th>Действия</th>
                    </tr>
                </thead>
                <tbody id="clientsTableBody">
                    <!-- Данные загружаются через JS -->
                </tbody>
            </table>
        </div>

        <!-- Пагинация -->
        <div class="pagination" id="pagination">
            <!-- Кнопки пагинации загружаются через JS -->
        </div>
    </div>

    <!-- Модальное окно детальной информации -->
    <div id="detailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Информация о клиенте</h2>
                <span class="close" onclick="closeDetailModal()">&times;</span>
            </div>
            <div class="modal-body" id="detailModalBody">
                <!-- Детали клиента загружаются через JS -->
            </div>
        </div>
    </div>

    <!-- Модальное окно формы (универсальное для add/edit) -->
    <div id="formModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="formModalTitle">Форма клиента</h2>
                <span class="close" onclick="closeFormModal()">&times;</span>
            </div>
            <div class="modal-body">
                <form id="clientForm">
                    <input type="hidden" id="clientId" name="client_id">
                    <input type="hidden" id="formMode" value="add">

                    <div class="form-group">
                        <label for="name">Название *</label>
                        <input type="text" id="name" name="name" required>
                        <span class="error" id="nameError"></span>
                    </div>

                    <div class="form-group">
                        <label for="ownershipType">Тип собственности *</label>
                        <select id="ownershipType" name="ownership_type" required>
                            <option value="">Выберите тип</option>
                            <option value="ООО">ООО</option>
                            <option value="АО">АО</option>
                            <option value="ЗАО">ЗАО</option>
                            <option value="ОАО">ОАО</option>
                            <option value="ПАО">ПАО</option>
                            <option value="ИП">ИП</option>
                        </select>
                        <span class="error" id="ownershipTypeError"></span>
                    </div>

                    <div class="form-group">
                        <label for="address">Адрес *</label>
                        <input type="text" id="address" name="address" required>
                        <span class="error" id="addressError"></span>
                    </div>

                    <div class="form-group">
                        <label for="phone">Телефон *</label>
                        <input type="tel" id="phone" name="phone" required 
                               placeholder="+79991234567">
                        <span class="error" id="phoneError"></span>
                    </div>

                    <div class="form-group">
                        <label for="contactPerson">Контактное лицо *</label>
                        <input type="text" id="contactPerson" name="contact_person" required>
                        <span class="error" id="contactPersonError"></span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <button type="button" class="btn btn-secondary" onclick="closeFormModal()">Отмена</button>
                    </div>

                    <div id="formErrors" class="error-summary"></div>
                </form>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="/static/js/api.js"></script>
    <script src="/static/js/observer.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
